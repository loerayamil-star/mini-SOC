<!--
  Config centralizada del grupo "npm" — se copia al Manager como
  /var/ossec/etc/shared/npm/agent.conf.

  RUTA PLACEHOLDER: /opt/npm/data/logs/ asume un bind mount del volumen de logs del
  contenedor de NPM hacia esa ruta del LXC 101. Confirma la ruta real contra cómo desplegaste
  el contenedor (docker inspect / tu docker-compose.yml) antes de aplicar esto — si el
  volumen no está mapeado a disco del LXC, el agente (que corre fuera del contenedor) no
  puede leer el log y hay que agregar el bind mount primero.
-->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/opt/npm/data/logs/proxy-host-*_access.log</location>
  </localfile>
</agent_config>
