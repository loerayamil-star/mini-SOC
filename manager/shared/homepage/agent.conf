<!--
  Config centralizada del grupo "homepage" — se copia al Manager como
  /var/ossec/etc/shared/homepage/agent.conf.

  Activa el módulo oficial docker-listener: se conecta al socket de Docker del LXC 102 y
  reporta eventos de ciclo de vida de contenedores (start/stop/pause/restart) directamente,
  sin necesidad de parsear logs de texto.

  Requisito a verificar el día de la ejecución (checklist): el proceso del agente necesita
  poder hablar con el socket de Docker (/var/run/docker.sock) — el agente corre como root
  por defecto, pero confírmalo antes de asumir que el wodle funciona.
-->
<agent_config>
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>
</agent_config>
