<!--
  Config centralizada del grupo "pihole" — se copia al Manager como
  /var/ossec/etc/shared/pihole/agent.conf. Todo agente asignado a este grupo la recibe
  automáticamente, sin tocar su ossec.conf local.
-->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/pihole/pihole.log</location>
  </localfile>
</agent_config>
