<!--
  Config centralizada del grupo "proxmox-host" — se copia al Manager como
  /var/ossec/etc/shared/proxmox-host/agent.conf.

  Solo cubre FIM sobre /etc/pve (el filesystem cluster de configuración de Proxmox). SSH del
  host NO necesita nada aquí — el agente hereda el ruleset stock de Wazuh para sshd/PAM
  (Debian) apenas se instala, sin config adicional.

  realtime="yes": detecta el cambio casi al instante, no en el barrido periódico (por
  default cada 12h) — para /etc/pve, que es configuración crítica del cluster, vale la
  latencia extra de CPU que implica el watch en tiempo real (footprint despreciable para 3
  agentes + 1 host).

  ADVERTENCIA TÉCNICA IMPORTANTE (auditoría 19-sep-2026, Hallazgo G — el hallazgo más serio
  de toda la auditoría de Fase 1+2): /etc/pve NO es un filesystem normal en disco. Es
  pmxcfs, un filesystem FUSE que Proxmox usa para sincronizar la config del cluster.
  realtime="yes" depende de inotify de Linux, e inotify tiene problemas de compatibilidad
  CONOCIDOS Y DOCUMENTADOS con filesystems FUSE — el comportamiento varía según la
  implementación y no lo verifiqué contra una prueba real. Es honestamente posible que esta
  alerta nunca dispare en tiempo real, en silencio, sin que te enteres hasta que la
  necesites de verdad.

  QUÉ HACER: el checklist de Fase 2 (docs/fase2-checkpoints.md) ya incluye una prueba de
  fuego específica para esto — NO la saltes. Si tocas un archivo en /etc/pve y no aparece
  la alerta en minutos, cambia el plan:
    a) Prueba "whodata" en vez de realtime (usa el subsistema de auditoría de Linux en vez
       de inotify — requiere auditd instalado y puede ser más confiable sobre FUSE, pero
       tampoco lo verifiqué):
         <directories whodata="yes" report_changes="yes" check_all="yes">/etc/pve</directories>
    b) Si eso tampoco dispara, cae a un barrido programado más frecuente que el default de
       12h (pierdes tiempo real, pero es la opción más confiable sobre cualquier
       filesystem). Agrega, fuera de <directories>, un bloque como:
         <frequency>3600</frequency>
       (3600 segundos = cada hora, en vez de las 12h por default)
-->
<agent_config>
  <syscheck>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/pve</directories>
  </syscheck>
</agent_config>
